<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Opening… | Garry Engineering Portfolio</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1118;color:#eef4f9;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    .box{width:min(520px,calc(100% - 32px));padding:28px;border:1px solid #263647;border-radius:18px;background:#111a24;text-align:center}
    .spin{width:34px;height:34px;margin:0 auto 18px;border:3px solid #2b3b4d;border-top-color:#7cc4ff;border-radius:50%;animation:s .8s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}} h1{font-size:1.3rem;margin:0 0 8px}p{color:#aab7c5;margin:8px 0}
    a{color:#8acbff}
  </style>
</head>
<body>
  <main class="box">
    <div class="spin" aria-hidden="true"></div>
    <h1 id="title">Opening selected page…</h1>
    <p id="status">Reading the current NFC destination.</p>
    <p id="fallback" hidden><a id="link" href="../">Open portfolio home</a></p>
  </main>
  <script>
    const API="https://api.github.com/repos/bajwa95/engineering-portfolio/contents/go/config.json?ref=main";
    const fallback="https://bajwa95.github.io/engineering-portfolio/";
    const decodeBase64Utf8=(value)=>{
      const bytes=Uint8Array.from(atob(value.replace(/\n/g,"")),c=>c.charCodeAt(0));
      return new TextDecoder().decode(bytes);
    };
    (async()=>{
      try{
        const response=await fetch(API+"&t="+Date.now(),{headers:{"Accept":"application/vnd.github+json"}});
        if(!response.ok) throw new Error("Config request failed");
        const file=await response.json();
        const cfg=JSON.parse(decodeBase64Utf8(file.content));
        const target=String(cfg.target||"").trim();
        if(!/^https?:\/\//i.test(target)) throw new Error("Invalid target URL");
        document.getElementById("title").textContent=cfg.label?("Opening "+cfg.label+"…"):"Opening selected page…";
        document.getElementById("status").textContent="Redirecting now.";
        location.replace(target);
      }catch(error){
        document.getElementById("title").textContent="Redirect unavailable";
        document.getElementById("status").textContent="The selected destination could not be loaded. You can continue to the portfolio.";
        const f=document.getElementById("fallback"); f.hidden=false;
        const a=document.getElementById("link"); a.href=fallback;
      }
    })();
  </script>
</body>
</html>
